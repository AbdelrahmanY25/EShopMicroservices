version: '3.8'

services:
    catalogdb:
      container_name: catalogdb
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=CatalogDb
      restart: always
      ports:
        - "5432:5432"
      volumes:
        - postgres_catalog:/var/lib/postgresql/18/data
      networks:
        - catalog-postgres-network

    basketdb:
      container_name: basketdb
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=BasketDb
      restart: always
      ports:
        - "5433:5432"
      volumes:
        - postgres_basket:/var/lib/postgresql/18/data
      networks:
        - basket-postgres-network

    distributedcache:
      container_name: distributedcache
      restart: always
      ports:
        - "6379:6379"
      networks:
        - basket-redis-network

    orderdb:
      container_name: orderdb
      environment:
        - ACCEPT_EULA=Y
        - MSSQL_SA_PASSWORD=SwN@12345678
      restart: always
      ports:
        - "1433:1433"
      networks:
        - order-mssql-network

    messagebroker:
      container_name: messagebroker
      hostname: ecommerce-mq
      environment:
        - RABBITMQ_DEFAULT_USER=guest
        - RABBITMQ_DEFAULT_PASS=guest
      restart: always
      ports:
        - "5672:5672"
        - "15672:15672"

    catalog.api:
      container_name: catalog.api
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_HTTP_PORTS=8080
        - ASPNETCORE_HTTPS_PORTS=8081
        - ConnectionStrings__Database=Server=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres;Include Error Detail=true
      depends_on:
        - catalogdb
      ports:
        - "6660:8080"
        - "6666:8081"
      volumes:
        - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
        - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
        - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
        - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      networks:
        - service-network
        - catalog-postgres-network

    basket.api:
      container_name: basket.api
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_HTTP_PORTS=8080
        - ASPNETCORE_HTTPS_PORTS=8081
        - ConnectionStrings__Database=Server=basketdb;Port=5432;Database=BasketDb;User Id=postgres;Password=postgres;Include Error Detail=true
        - ConnectionStrings__Redis=distributedcache:6379
        - GrpcSettings__DiscountUrl=https://discount.grpc:8081
      depends_on:
        - basketdb
        - distributedcache
        - discount.grpc
      ports:
        - "6661:8080"
        - "6667:8081"
      volumes:
        - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
        - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
        - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
        - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      networks:
        - service-network
        - basket-postgres-network
        - basket-redis-network

    discount.grpc:
      container_name: discount.grpc
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_HTTP_PORTS=8080
        - ASPNETCORE_HTTPS_PORTS=8081
        - ConnectionStrings__Database=Data Source=discountdb
      ports:
        - "6662:8080"
        - "6668:8081"
      volumes:
        - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
        - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
        - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
        - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      networks:
        - service-network

    ordering.api:
      container_name: ordering.api
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_HTTP_PORTS=8080
        - ASPNETCORE_HTTPS_PORTS=8081
        - ConnectionStrings__Database=Server=orderdb,1433;Database=OrderDb;User Id=sa;Password=SwN@12345678;Encrypt=False;TrustServerCertificate=True
      depends_on:
        - orderdb
      ports:
        - "6663:8080"
        - "6669:8081"
      volumes:
        - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
        - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
        - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
        - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      networks:
        - service-network
        - order-mssql-network

    yarpapigateway:
      container_name: yarpapigateway
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ASPNETCORE_HTTP_PORTS=8080
        - ASPNETCORE_HTTPS_PORTS=8081
      depends_on:
        - catalog.api
        - basket.api
        - ordering.api
      ports:
        - "6664:8080"
        - "6665:8081"
      volumes:
        - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
        - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
        - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
        - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      networks:
        - service-network